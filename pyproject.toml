[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthcorebench"
version = "2.5.0"
description = "Config-driven evaluation toolkit for medical language models"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.30",
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "pillow>=10.0",
  "pyarrow>=14.0",
  "rouge-score>=0.1.2",
  "sacrebleu>=2.4",
  "jieba>=0.42",
  "tqdm>=4.60",
  "ijson>=3.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.23"]
video = ["av>=13.0"]

[tool.setuptools.packages.find]
include = ["healthcorebench*"]
